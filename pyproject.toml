[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motioniq-cam"
version = "2.0.0"
description = "Console motion-detection & evidence system built with OpenCV and the Python standard library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["computer-vision", "opencv", "motion-detection", "security-camera", "robotics"]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
motioniq = "motioniq.cli:main"

[tool.setuptools]
packages = ["motioniq"]
